syntax = "proto3";

package acme.options.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/labset/go-protoc-gen-plugin/api/acme/options/v1;optionsV1";

enum Role {
  ROLE_UNSPECIFIED = 0;
}

message AcmeMessageOptions {
  Role role = 1;
}

extend google.protobuf.MessageOptions {
  AcmeMessageOptions message = 50001;
}
