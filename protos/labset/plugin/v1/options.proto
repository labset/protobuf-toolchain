syntax = "proto3";

package labset.plugin.v1;

import "google/protobuf/descriptor.proto";
import "labset/plugin/v1/enums.proto";

option go_package = "github.com/labset/protobuf-toolchain/api/labset/plugin/v1;pluginV1";

message MessageOptions {
  Role role = 1;
  repeated Operation operations = 2;
}

extend google.protobuf.MessageOptions {
  MessageOptions message = 50001;
}
