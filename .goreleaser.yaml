version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go fmt ./...
    - go test ./...

builds:
  - main: cmd/protoc-gen-labset/main.go
    id: protoc-gen-labset
    binary: protoc-gen-labset
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

  - main: cmd/labset-lint-plugin/main.go
    id: labset-lint-plugin
    binary: labset-lint-plugin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: protobuf-toolchain
    binaries:
      - protoc-gen-labset
      - labset-lint-plugin
    repository:
      owner: labset
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/labset/protobuf-toolchain"
    description: "Protobuf toolchain with protoc-gen-labset codegen plugin and labset-lint-plugin linter"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew: bump {{ .ProjectName }} to {{ .Tag }}"
    # only publish the tap for real releases, never for snapshots
    skip_upload: auto
    # the binaries are not signed/notarized, so strip the quarantine flag on macOS
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/protoc-gen-labset"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/labset-lint-plugin"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
