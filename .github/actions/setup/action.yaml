name: setup
description: Install the mise-managed toolchain and restore build caches.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4.2.0

    - name: Resolve cache directories
      id: dirs
      shell: bash
      run: |
        echo "gomod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "gobuild=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go and tool build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.dirs.outputs.gomod }}
          ${{ steps.dirs.outputs.gobuild }}
          ~/.cache/golangci-lint
          ~/.cache/buf
        key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum', '**/buf.yaml') }}
        restore-keys: |
          ${{ runner.os }}-build-
